# Configuration nginx pour lepalaisdesongles.fr
#
# À installer sur le VPS :
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/lepalaisdesongles.fr
#   sudo ln -s /etc/nginx/sites-available/lepalaisdesongles.fr /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Puis Certbot pour le certificat HTTPS (voir deploy/README.md) :
#   sudo certbot --nginx -d lepalaisdesongles.fr -d www.lepalaisdesongles.fr
#
# Ce fichier ne contient volontairement PAS la configuration TLS :
# Certbot la génère et l'insère automatiquement au-dessus de ce
# bloc "server" HTTP lors de la première exécution.

server {
    listen 80;
    listen [::]:80;

    server_name lepalaisdesongles.fr www.lepalaisdesongles.fr;

    # Limite la taille des requêtes entrantes (formulaires, uploads
    # via UploadThing passent par leur propre service, pas par nginx,
    # mais on garde une marge raisonnable pour les autres routes).
    client_max_body_size 10m;

    # Compression : Next.js compresse déjà (compress: true dans
    # next.config.ts), on laisse nginx gérer le reste au cas où.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        # Doit correspondre au port réellement utilisé par l'app (voir
        # `env.PORT` dans deploy/ecosystem.config.cjs) : si ce VPS
        # héberge plusieurs apps, ce port peut différer de 3000.
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;

        # En-têtes standards pour que Next.js voie la vraie origine
        # de la requête (IP cliente, protocole d'origine, host).
        # src/lib/security/rate-limit.ts lit x-forwarded-for /
        # x-real-ip en repli, donc ces en-têtes sont nécessaires
        # pour un rate-limiting correct par IP.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upgrade websocket au cas où (non utilisé actuellement par
        # l'app, mais inoffensif à garder pour l'avenir).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_cache_bypass $http_upgrade;
    }
}
